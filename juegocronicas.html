<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crónicas: Batalla por el Territorio</title>
    <!-- Librería para leer Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .card-gold { border: 2px solid #fbbf24; background: rgba(15, 23, 42, 0.95); box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); }
        .btn-action { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 800; transition: all 0.2s; }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3); }
        .btn-action:disabled { background: #1e293b; color: #475569; cursor: not-allowed; opacity: 0.5; }
        .reino-badge { transition: all 0.3s; opacity: 0.4; transform: scale(0.9); border: 1px solid #1e293b; }
        .reino-active { opacity: 1; transform: scale(1.1); border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); background: #0f172a; }
        .option-btn { transition: all 0.2s; border: 1px solid #334155; text-align: left; }
        .option-btn:hover:not(:disabled) { border-color: #fbbf24; background: #1e293b; }
        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #b91c1c !important; border-color: #ef4444 !important; }
        .overlay-screen { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">

    <!-- Pantalla Inicial -->
    <div id="screen-home" class="w-full max-w-md flex flex-col items-center py-10">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-black text-yellow-500 italic tracking-tighter mb-2">CRÓNICAS</h1>
            <h2 class="text-xs font-bold tracking-[0.4em] text-slate-400 uppercase">Edición Local</h2>
            <p id="status-text" class="text-[10px] mt-6 text-slate-400 uppercase font-bold tracking-widest text-center w-full">Esperando biblioteca de preguntas...</p>
        </div>

        <div class="w-full space-y-6 bg-slate-900/50 p-8 rounded-[2.5rem] border border-slate-800 backdrop-blur-md">
            <div>
                <label class="text-[10px] font-black text-yellow-600 uppercase ml-3 mb-1 block tracking-widest">Región de la Campaña</label>
                <select id="select-region" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-yellow-500 text-white appearance-none">
                    <option value="" disabled selected>Selecciona Región</option>
                    <option value="MODELIA">Modelia</option>
                    <option value="FILADELFIA">Filadelfia</option>
                </select>
            </div>
            
            <div>
                <label class="text-[10px] font-black text-yellow-600 uppercase ml-3 mb-1 block tracking-widest">Territorio en Disputa</label>
                <select id="select-territorio" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-yellow-500 text-white appearance-none">
                    <option value="" disabled selected>Selecciona Territorio</option>
                    <option value="BABILONIA">Babilonia</option>
                    <option value="MEDO PERSIA">Medo Persia</option>
                    <option value="GRECIA">Grecia</option>
                    <option value="ROMA">Roma</option>
                    <option value="EGIPTO">Egipto</option>
                    <option value="JERUSALÉN">Jerusalén</option>
                    <option value="TIERRA PROMETIDA">Tierra Prometida</option>
                </select>
            </div>

            <button id="btn-start" onclick="iniciarBatalla()" disabled class="btn-action w-full py-5 rounded-2xl shadow-2xl transform active:scale-95 text-xl uppercase italic">
                INICIAR CONQUISTA
            </button>
        </div>

        <div class="mt-10 flex flex-col items-center bg-slate-900/40 p-6 rounded-3xl border border-slate-800/50 w-full">
            <p class="text-[10px] text-slate-400 uppercase font-black mb-4 tracking-[0.2em]">Cargar Biblioteca (Excel)</p>
            <input type="file" id="file-input" class="hidden" accept=".xlsx, .xls">
            <button onclick="document.getElementById('file-input').click()" class="bg-yellow-500/5 hover:bg-yellow-500/10 px-8 py-4 rounded-2xl text-[11px] uppercase tracking-widest font-black text-yellow-500 border border-yellow-500/20 transition-all flex items-center gap-3 w-full justify-center">
                <span>📁</span> CARGAR PREGUNTAS
            </button>
            <p class="text-[8px] text-slate-600 mt-4 text-center uppercase tracking-tighter italic">Nota: Las preguntas se borran al cerrar el navegador.</p>
        </div>
    </div>

    <!-- Pantalla de Juego -->
    <div id="screen-game" class="hidden w-full max-w-4xl flex flex-col">
        <div class="flex justify-between items-center mb-6">
             <button onclick="confirmarTerminar()" class="text-[10px] font-black text-red-500 border border-red-500/30 px-4 py-2 rounded-xl hover:bg-red-500/10 uppercase tracking-widest transition-all">
                ⚠️ Terminar Batalla
            </button>
            <span id="display-territorio" class="text-yellow-500 font-black text-[10px] tracking-[0.3em] uppercase bg-yellow-500/5 px-6 py-2 rounded-full border border-yellow-500/20"></span>
            <div class="w-24"></div> <!-- Spacer -->
        </div>

        <div class="grid grid-cols-4 gap-2 mb-8">
            <div id="badge-ISRAEL" class="reino-badge bg-slate-900/50 p-3 rounded-2xl text-center">
                <div class="text-[8px] font-bold text-slate-500 uppercase tracking-tighter">ISRAEL</div>
                <div class="text-xl font-black text-white" id="score-ISRAEL">0</div>
            </div>
            <div id="badge-JUDÁ" class="reino-badge bg-slate-900/50 p-3 rounded-2xl text-center">
                <div class="text-[8px] font-bold text-slate-500 uppercase tracking-tighter">JUDÁ</div>
                <div class="text-xl font-black text-white" id="score-JUDÁ">0</div>
            </div>
            <div id="badge-DAVID" class="reino-badge bg-slate-900/50 p-3 rounded-2xl text-center">
                <div class="text-[8px] font-bold text-slate-500 uppercase tracking-tighter">DAVID</div>
                <div class="text-xl font-black text-white" id="score-DAVID">0</div>
            </div>
            <div id="badge-JOSAFAT" class="reino-badge bg-slate-900/50 p-3 rounded-2xl text-center">
                <div class="text-[8px] font-bold text-slate-500 uppercase tracking-tighter">JOSAFAT</div>
                <div class="text-xl font-black text-white" id="score-JOSAFAT">0</div>
            </div>
        </div>

        <div class="card-gold p-8 rounded-[2.5rem] text-center mb-8 relative min-h-[220px] flex items-center justify-center">
            <div id="game-timer" class="absolute -top-6 left-1/2 -translate-x-1/2 bg-yellow-500 text-black w-14 h-14 rounded-full flex items-center justify-center font-black text-2xl border-8 border-[#020617] shadow-xl">15</div>
            <p id="question-text" class="text-2xl font-bold leading-tight px-4 md:text-3xl"></p>
        </div>

        <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Resultados -->
    <div id="screen-results" class="hidden w-full max-w-md flex flex-col items-center py-10">
        <h2 class="text-4xl font-black text-yellow-500 mb-6 italic tracking-tighter uppercase text-center leading-none">LA CONQUISTA<br>HA TERMINADO</h2>
        <div id="winner-card" class="w-full card-gold p-12 rounded-[3.5rem] text-center mb-10">
            <div id="res-territorio" class="text-xs font-black text-slate-500 uppercase tracking-widest mb-2"></div>
            <div id="res-reino" class="text-6xl font-black text-yellow-500 my-4 italic drop-shadow-lg text-center w-full"></div>
            <div id="res-stats" class="text-slate-400 font-bold text-sm tracking-tighter bg-black/40 py-2 px-4 rounded-full inline-block"></div>
        </div>
        
        <div class="w-full space-y-4">
            <button onclick="location.reload()" class="btn-action w-full py-6 rounded-2xl uppercase italic font-black shadow-2xl">
                Nueva Partida
            </button>
            <button onclick="irAlMenu()" class="w-full py-4 rounded-2xl border border-slate-700 text-slate-400 font-bold uppercase tracking-widest text-xs hover:bg-slate-800 transition-all">
                Ir al Menú Principal
            </button>
        </div>
    </div>

    <!-- Modales de Feedback -->
    <div id="timeout-msg" class="overlay-screen bg-black/95 text-center flex-col">
        <h2 class="text-7xl font-black text-red-600 italic animate-bounce">¡TIEMPO!</h2>
        <p class="text-slate-400 uppercase tracking-widest text-xs mt-4">Siguiente reino al mando...</p>
    </div>
    <div id="correct-msg" class="overlay-screen bg-emerald-950/98 text-center">
        <h2 class="text-7xl font-black text-emerald-400 italic">¡VICTORIA!</h2>
    </div>
    <div id="wrong-msg" class="overlay-screen bg-red-950/98 text-center">
        <div class="p-8 max-w-sm text-center">
            <h2 class="text-5xl font-black text-red-500 italic mb-6">¡FALLO!</h2>
            <div class="bg-black/60 p-6 rounded-3xl border border-red-500/20">
                <p class="text-[10px] text-slate-500 uppercase mb-2">La respuesta correcta era:</p>
                <p id="correct-reveal" class="text-xl font-bold text-white"></p>
            </div>
        </div>
    </div>

    <script>
        const REINOS = ['ISRAEL', 'JUDÁ', 'DAVID', 'JOSAFAT'];
        let dbPreguntasLocal = []; 
        let gameData = { 
            preguntas: [], 
            preguntaActual: 0, 
            reinoTurnoIdx: 0, 
            scores: { ISRAEL: 0, JUDÁ: 0, DAVID: 0, JOSAFAT: 0 },
            territorio: ""
        };
        let timer, timeLeft = 15;

        const updateStatus = (text, isError = false) => {
            const el = document.getElementById('status-text');
            el.innerText = text;
            el.className = isError ? "text-[10px] mt-6 text-red-500 uppercase font-bold tracking-widest animate-pulse" : "text-[10px] mt-6 text-slate-400 uppercase font-bold tracking-widest";
        };

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            updateStatus("⏳ Procesando pergaminos...");
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const dataArr = new Uint8Array(ev.target.result);
                    const workbook = XLSX.read(dataArr, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    
                    if (json && json.length > 0) {
                        dbPreguntasLocal = json.map(fila => {
                            const n = {};
                            for (let k in fila) n[k.trim()] = fila[k];
                            return n;
                        });

                        const check = ['Question', 'A', 'B', 'C', 'D', 'Correct'];
                        const faltan = check.filter(c => !(c in dbPreguntasLocal[0]));
                        
                        if (faltan.length > 0) {
                            updateStatus("❌ Columnas faltantes: " + faltan.join(", "), true);
                        } else {
                            document.getElementById('btn-start').disabled = false;
                            updateStatus("✅ " + dbPreguntasLocal.length + " Preguntas listas");
                        }
                    }
                } catch(err) {
                    updateStatus("❌ Error de lectura", true);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        function iniciarBatalla() {
            const reg = document.getElementById('select-region').value;
            const ter = document.getElementById('select-territorio').value;
            if(!reg || !ter) return alert("Selecciona región y territorio.");

            gameData.preguntas = [...dbPreguntasLocal].sort(() => Math.random() - 0.5).slice(0, 20);
            gameData.territorio = ter;
            gameData.preguntaActual = 0;
            gameData.reinoTurnoIdx = 0;
            gameData.scores = { ISRAEL: 0, JUDÁ: 0, DAVID: 0, JOSAFAT: 0 };

            document.getElementById('display-territorio').innerText = `${ter} | ${reg}`;
            showScreen('screen-game');
            renderTurno();
        }

        function renderTurno() {
            if(gameData.preguntaActual >= gameData.preguntas.length) return finalizarBatalla();
            
            const reinoActual = REINOS[gameData.reinoTurnoIdx];
            REINOS.forEach(r => {
                document.getElementById(`badge-${r}`).classList.toggle('reino-active', r === reinoActual);
                document.getElementById(`score-${r}`).innerText = gameData.scores[r];
            });

            const q = gameData.preguntas[gameData.preguntaActual];
            document.getElementById('question-text').innerText = q.Question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            ['A', 'B', 'C', 'D'].forEach(opt => {
                if(q[opt]) {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full p-5 bg-slate-900/80 rounded-2xl text-left flex items-center";
                    btn.innerHTML = `<span class="w-8 h-8 flex-shrink-0 rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center mr-4 text-xs font-black text-yellow-500">${opt}</span> <span class="font-bold text-slate-100">${q[opt]}</span>`;
                    btn.onclick = () => procesarRespuesta(opt, btn);
                    container.appendChild(btn);
                }
            });
            startTimer();
        }

        function startTimer() {
            clearInterval(timer); 
            timeLeft = 15; 
            const disp = document.getElementById('game-timer');
            disp.innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--; 
                disp.innerText = timeLeft;
                if(timeLeft <= 0) { 
                    clearInterval(timer); 
                    showFeedback('timeout-msg', 1500); 
                }
            }, 1000);
        }

        function procesarRespuesta(sel, btn) {
            clearInterval(timer);
            const q = gameData.preguntas[gameData.preguntaActual];
            const reino = REINOS[gameData.reinoTurnoIdx];
            if(sel === q.Correct) {
                btn.classList.add('correct');
                gameData.scores[reino]++;
                showFeedback('correct-msg', 1000);
            } else {
                btn.classList.add('wrong');
                document.getElementById('correct-reveal').innerText = `${q.Correct}: ${q[q.Correct]}`;
                showFeedback('wrong-msg', 2500);
            }
        }

        function showFeedback(id, ms) {
            document.getElementById(id).style.display = 'flex';
            setTimeout(() => {
                document.getElementById(id).style.display = 'none';
                gameData.preguntaActual++;
                gameData.reinoTurnoIdx = (gameData.reinoTurnoIdx + 1) % 4;
                renderTurno();
            }, ms);
        }

        function finalizarBatalla() {
            clearInterval(timer);
            showScreen('screen-results');
            const res = REINOS.map(r => ({ reino: r, aciertos: gameData.scores[r] })).sort((a,b) => b.aciertos - a.aciertos);
            document.getElementById('res-territorio').innerText = gameData.territorio;
            document.getElementById('res-reino').innerText = res[0].reino;
            document.getElementById('res-stats').innerText = `${res[0].aciertos} PUNTOS DE CONQUISTA`;
        }

        function confirmarTerminar() {
            if(confirm("¿Estás seguro de que deseas terminar la batalla ahora? Se mostrarán los resultados con los puntos actuales.")) {
                finalizarBatalla();
            }
        }

        function irAlMenu() {
            showScreen('screen-home');
        }

        function showScreen(id) {
            ['screen-home', 'screen-game', 'screen-results'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
